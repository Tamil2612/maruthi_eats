name: Build and deploy Maruthi Eats web PWA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate production secrets
        if: github.event_name == 'push'
        env:
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARUTHI_EATS }}
        run: |
          test -n "$FCM_VAPID_KEY" || { echo "Missing GitHub secret: FCM_VAPID_KEY"; exit 1; }
          test -n "$MAPS_API_KEY" || { echo "Missing GitHub secret: MAPS_API_KEY"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_MARUTHI_EATS"; exit 1; }

      - name: Build web PWA
        env:
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build web --release \
            --dart-define=FCM_VAPID_KEY="$FCM_VAPID_KEY" \
            --dart-define=MAPS_API_KEY="$MAPS_API_KEY"

      - name: Verify PWA messaging worker
        run: test -f build/web/firebase-messaging-sw.js

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARUTHI_EATS }}
          projectId: maruthi-eats
          target: customer
          channelId: live
