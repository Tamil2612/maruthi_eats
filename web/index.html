<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Maruthi Eats - Premium Food Delivery">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maruthi Eats">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Maruthi Eats</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS SDK -->
  <script src="https://maps.googleapis.com/maps/api/js?key={{MAPS_API_KEY}}"></script>

  <!-- Razorpay Checkout.js for Web / PWA payments -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    // Global JS Error Listener
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("[GLOBAL JS ERROR]:", message, "at", source, ":", lineno, ":", colno);
      return false;
    };

    function openRazorpayWebCheckout(optionsJson) {
      try {
        var options = JSON.parse(optionsJson);

        options.handler = function(response) {
          if (typeof window._rzpSuccess === 'function') {
            window._rzpSuccess(
              response.razorpay_payment_id || '',
              response.razorpay_order_id || '',
              response.razorpay_signature || ''
            );
          }
        };

        options.modal = options.modal || {};
        options.modal.ondismiss = function() {
          if (typeof window._rzpDismiss === 'function') {
            window._rzpDismiss();
          }
        };

        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function(response) {
          var err = response.error || {};
          var msg = err.description || err.reason || 'Payment failed';
          if (typeof window._rzpError === 'function') {
            window._rzpError(msg);
          }
        });

        rzp.open();
      } catch (e) {
        console.error('Razorpay Web Checkout error:', e);
        if (typeof window._rzpError === 'function') {
          window._rzpError('Could not open Razorpay checkout: ' + (e.message || e));
        }
      }
    }
  </script>
</head>
<body>
  <div id="loading-indicator" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #FFF8E7; color: #800020;">
    <div style="font-size: 24px; font-weight: bold; margin-bottom: 16px;">MARUTHI EATS</div>
    <div style="font-size: 14px;">Preparing your experience...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('load', function() {
      var observer = new MutationObserver(function(mutations) {
        if (document.querySelector('flt-glass-pane')) {
          var loader = document.getElementById('loading-indicator');
          if (loader) loader.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true });
    });
  </script>
</body>
</html>
